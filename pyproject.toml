[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-position-system"
version = "1.0.0"
description = "Two services that stream order updates and maintain net positions per symbol."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
position-service = "trading.position_service:main"
order-update-service = "trading.order_update_service:main"

[tool.setuptools.packages.find]
include = ["trading*"]

[tool.setuptools.package-data]
# Ship the dashboard with the package so an installed copy serves it too.
trading = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Our own code must stay deprecation-free.
    "error::DeprecationWarning:trading.*",
    # Noise from the installed starlette/httpx versions, not from us.
    "ignore::UserWarning",
    "ignore:.*httpx.*:DeprecationWarning",
]
